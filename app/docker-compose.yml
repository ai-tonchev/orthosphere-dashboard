

services:
  static-site:
    image: nginx
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - web

  dashboard:
    image: app-dashboard:latest
    container_name: dashboard
    expose:
      - "8050:8050"         # Internal port
    restart: unless-stopped
    networks:
      - web

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - dashboard

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    name: web
