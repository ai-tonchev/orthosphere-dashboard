# fly.toml app configuration file generated for orthosphere-dashboard on 2025-12-09T17:12:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'orthosphere-dashboard'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8050
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1

